<!DOCTYPE html><html><head><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><title>Vault</title><style>body{background:#0A0A0A;color:white;}</style></head>
<body><h1>🔒 VAULT</h1><button onclick="guardar()">GUARDAR R$ 1000 (7 dias)</button><button onclick="resgatar()">RESGATAR</button><div id="msg"></div>
<script>async function guardar(){let r=await fetch(`api/banco.php?acao=vault&subacao=guardar&usuario_id=${localStorage.getItem('uid')}&valor=1000`);let d=await r.json();alert(d.mensagem);}
async function resgatar(){let r=await fetch(`api/banco.php?acao=vault&subacao=resgatar&usuario_id=${localStorage.getItem('uid')}`);let d=await r.json();alert(`Resgatado: R$ ${d.resgatado}`);}</script></body></html>

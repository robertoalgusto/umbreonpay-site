<!DOCTYPE html><html><head><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><title>Swap</title><style>body{background:#0A0A0A;color:white;}</style></head>
<body><h1>🔄 SWAP (BRL → UBC)</h1><input type="number" id="valor"><button onclick="swap()">CONVERTER</button><div id="msg"></div>
<script>async function swap(){let v=document.getElementById('valor').value;let r=await fetch(`api/banco.php?acao=swap&usuario_id=${localStorage.getItem('uid')}&valor=${v}`);let d=await r.json();document.getElementById('msg').innerHTML=`✅ ${d.valor_ubc} UBC`;}</script></body></html>

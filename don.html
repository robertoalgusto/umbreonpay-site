<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Painel do Don — UmbreonPay</title><link rel="stylesheet" href="style.css"><style>.don-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:30px}.don-card{background:var(--cinza-escuro);padding:20px;border:1px solid #222;text-align:center}.don-card h3{color:var(--dourado);font-size:12px;letter-spacing:2px;margin-bottom:10px}.don-card .valor{font-size:28px;font-weight:bold}.btn-fenix{background:#FF1744;color:white;padding:15px 30px;border:none;font-weight:bold;cursor:pointer;width:100%;margin-top:20px}</style></head><body><header><nav><div class="logo">UMBREONPAY — PAINEL DO DON</div></nav></header><section style="padding-top:100px" class="section-black"><div class="container"><h2 style="color:var(--dourado)">👑 PAINEL DO DON</h2><div class="divider-small"></div><div class="don-grid"><div class="don-card"><h3>Total de Clientes</h3><div class="valor" style="color:white">1.342</div></div><div class="don-card"><h3>Capital Total</h3><div class="valor" style="color:#00C853">R$ 12.8M</div></div><div class="don-card"><h3>Taxas Hoje</h3><div class="valor" style="color:var(--dourado)">R$ 47.250</div></div><div class="don-card"><h3>Taxas Mês</h3><div class="valor" style="color:var(--dourado)">R$ 1.417.500</div></div><div class="don-card"><h3>Contas Ativas</h3><div class="valor" style="color:white">847</div></div><div class="don-card"><h3>Carteiras TWS</h3><div class="valor" style="color:white">100</div></div><div class="don-card"><h3>Mixer Ciclos</h3><div class="valor" style="color:white">12.847</div></div><div class="don-card"><h3>Lucro Líquido</h3><div class="valor" style="color:#00C853">R$ 4.2M</div></div></div><button class="btn-fenix" onclick="confirm('Tem certeza?') && alert('Protocolo Fênix ativado. Capital drenado para carteiras frias.')">🔴 PROTOCOLO FÊNIX FINANCEIRO</button></div></section></body></html>

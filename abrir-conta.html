<!DOCTYPE html>
<html>
<head>
  <meta name="description" content="UmbreonPay – O banco digital que opera nas sombras. Anonimato, segurança e poder.">
  <meta name="keywords" content="banco digital, criptomoedas, monero, privacidade, anonimato">
  <meta name="author" content="UmbreonPay TWS">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <title>🔹 Abrir Conta - UmbreonPay</title>
    <style>body{background:#0A0A0A;color:white;font-family:monospace;text-align:center;padding:50px;}
    input,button{padding:15px;margin:10px;border-radius:10px;width:300px;}
    input{background:#1A1A2A;border:1px solid #C9A84C;color:white;}
    button{background:#C9A84C;border:none;cursor:pointer;}</style>
</head>
<body>
    <h1>🏦 ABRIR CONTA</h1>
    <input type="text" id="nome" placeholder="Nome completo">
    <input type="text" id="cpf" placeholder="CPF">
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="cadastrar()">CRIAR CONTA</button>
    <div id="msg"></div>
    <p><a href="login.html">Já tenho conta</a></p>
    <script>
        async function cadastrar() {
            const dados = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };
            const response = await fetch('http://localhost:5000/api/cadastrar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            const resultado = await response.json();
            if (resultado.sucesso) {
                document.getElementById('msg').innerHTML = `<p style="color:green">✅ ${resultado.mensagem}</p>`;
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                document.getElementById('msg').innerHTML = `<p style="color:red">❌ ${resultado.erro}</p>`;
            }
        }
    </script>
<div class="bunker-coords" style="display: none;">50.1109° N, 8.6821° E – Centro de operações de contingência</div>
</body>
</html>

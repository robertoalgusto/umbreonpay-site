<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Conta — UmbreonPay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">UMBREONPAY</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="taxas.html">Taxas</a></li>
                <li><a href="seguranca.html">Segurança</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="login.html" class="btn-outline">Entrar</a>
                <a href="abrir-conta.html" class="btn-gold">Abrir Conta</a>
            </div>
        </nav>
    </header>

    <section style="padding-top: 150px;" class="section-dark">
        <div class="container">
            <h2>Abrir Sua Conta</h2>
            <div class="divider-small"></div>
            <div class="form-container">
                <form id="formCadastro" onsubmit="cadastrar(event)">
                    <div class="form-group">
                        <input type="text" id="nome" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="cpf" placeholder="CPF" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" placeholder="E-mail" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="telefone" placeholder="Telefone">
                    </div>
                    <div class="form-group">
                        <input type="password" id="senha" placeholder="Senha (8 dígitos)" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirmar" placeholder="Confirmar senha" required>
                    </div>
                    <div id="mensagem" style="text-align: center; margin: 15px 0;"></div>
                    <button type="submit">CRIAR CONTA</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>UMBREONPAY — POTESTAS IN UMBRA</p>
        <p class="footer-small">© 2026 UmbreonPay. Todos os direitos reservados.</p>
    </footer>

    <script>
    function cadastrar(event) {
        event.preventDefault();
        const senha = document.getElementById('senha').value;
        const confirmar = document.getElementById('confirmar').value;
        const msg = document.getElementById('mensagem');
        
        if (senha !== confirmar) {
            msg.innerHTML = '<span style="color: red;">Senhas não conferem</span>';
            return;
        }
        
        const dados = {
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            email: document.getElementById('email').value,
            senha: senha
        };
        
        msg.innerHTML = '<span style="color: #C9A84C;">Processando...</span>';
        
        fetch('https://umbreonpay-api.onrender.com/api/cadastrar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dados)
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                msg.innerHTML = '<span style="color: green;">✅ ' + data.mensagem + '</span>';
            } else {
                msg.innerHTML = '<span style="color: red;">❌ ' + data.mensagem + '</span>';
            }
        })
        .catch(() => {
            msg.innerHTML = '<span style="color: #C9A84C;">📡 Servidor offline. Conta será ativada em breve.</span>';
        });
    }
    </script>
</body>
</html>

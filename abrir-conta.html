<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Conta — UmbreonPay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">UMBREONPAY</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="taxas.html">Taxas</a></li>
                <li><a href="seguranca.html">Segurança</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="login.html" class="btn-outline">Entrar</a>
                <a href="abrir-conta.html" class="btn-gold">Abrir Conta</a>
            </div>
        </nav>
    </header>

    <section style="padding-top: 150px;" class="section-dark">
        <div class="container">
            <h2>Abrir Sua Conta</h2>
            <div class="divider-small"></div>
            <div class="form-container">
                <form>
                    <div class="form-group">
                        <input type="text" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="CPF" required>
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="E-mail" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" placeholder="Telefone" required>
                    </div>
                    <div class="form-group">
                        <input type="password" placeholder="Senha (8 dígitos)" required>
                    </div>
                    <div class="form-group">
                        <input type="password" placeholder="Confirmar senha" required>
                    </div>
                    <button type="submit">CRIAR CONTA</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>UMBREONPAY — POTESTAS IN UMBRA</p>
        <p class="footer-small">© 2026 UmbreonPay. Todos os direitos reservados.</p>
    </footer>
</body>
</html>

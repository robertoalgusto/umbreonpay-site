<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C9A84C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="UmbreonPay">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Conta — UmbreonPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0A0A0A;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: #111;
            border: 1px solid #1A1A1A;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .register-card::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(75,0,130,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .logo-section img {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(201,168,76,0.4));
        }

        .logo-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: #C9A84C;
            letter-spacing: 5px;
        }

        .logo-section p {
            font-family: 'Cinzel', serif;
            font-size: 9px;
            color: #C9A84C;
            letter-spacing: 4px;
            margin-top: 8px;
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 15px 18px;
            background: #0A0A0A;
            border: 1px solid #1A1A1A;
            border-radius: 12px;
            color: #FFF;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #C9A84C;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
        }

        .form-group input::placeholder {
            color: #333;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: #C9A84C;
            color: #0A0A0A;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .btn-register:hover {
            background: #D4B35A;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201,168,76,0.2);
        }

        .msg {
            text-align: center;
            margin: 20px 0;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
            position: relative;
            z-index: 1;
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            position: relative;
            z-index: 1;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #C9A84C;
        }

        .footer-links span {
            color: #333;
            margin: 0 10px;
        }

        .selos {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .selo {
            background: #0A0A0A;
            padding: 8px 14px;
            border: 1px solid #1A1A1A;
            border-radius: 8px;
            font-size: 9px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo-section">
            <img src="assets/brasao.png" alt="UmbreonPay">
            <h2>UMBREONPAY</h2>
            <p>POTESTAS IN UMBRA</p>
        </div>

        <form id="formCadastro" onsubmit="cadastrar(event)">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="form-group">
                <label>Confirmar senha</label>
                <input type="password" id="confirmar" placeholder="Repita a senha" required>
            </div>

            <div class="msg" id="msg"></div>

            <button type="submit" class="btn-register">CRIAR CONTA</button>
        </form>

        <div class="selos">
            <div class="selo">🔒 AES-256</div>
            <div class="selo">🛡️ ANTI-MED</div>
            <div class="selo">🌍 3 CONTINENTES</div>
        </div>

        <div class="footer-links">
            <a href="login.html">Já tem conta? Entrar</a>
            <span>|</span>
            <a href="termos.html">Termos de Uso</a>
            <span>|</span>
            <a href="politica.html">Privacidade</a>
        </div>
    </div>

    <script>
    async function cadastrar(e) {
        e.preventDefault();
        const senha = document.getElementById('senha').value;
        const confirmar = document.getElementById('confirmar').value;
        const msg = document.getElementById('msg');

        if (senha !== confirmar) {
            msg.innerHTML = '<span style="color:#FF1744">Senhas não conferem</span>';
            return;
        }
        if (senha.length < 8) {
            msg.innerHTML = '<span style="color:#FF1744">Senha deve ter no mínimo 8 caracteres</span>';
            return;
        }

        msg.innerHTML = '<span style="color:#C9A84C">Criando sua conta...</span>';

        const dados = {
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value.replace(/\D/g,''),
            email: document.getElementById('email').value,
            senha: senha
        };

        try {
            const resposta = await fetch('https://umbreonpay-api.onrender.com/api/auth/cadastrar', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(dados)
            });
            const data = await resposta.json();

            if (data.ok) {
                msg.innerHTML = '<span style="color:#00C853">✅ Conta criada! Código: ' + data.codigo_afiliado + '</span>';
                document.getElementById('formCadastro').reset();
            } else {
                msg.innerHTML = '<span style="color:#FF1744">' + data.erro + '</span>';
            }
        } catch(erro) {
            msg.innerHTML = '<span style="color:#FF1744">Erro de conexão</span>';
        }
    }
    </script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
</body>
</html>

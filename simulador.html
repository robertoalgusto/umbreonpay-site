<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Rendimento — UmbreonPay</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .sim-container { background: var(--cinza-escuro); padding: 40px; max-width: 600px; margin: 0 auto; border: 1px solid #222; }
        .sim-container input[type=range] { width: 100%; margin: 20px 0; accent-color: var(--dourado); }
        .sim-container input[type=number] { width: 100%; padding: 15px; background: #111; border: 1px solid #333; color: white; font-size: 18px; text-align: center; margin-bottom: 20px; }
        .sim-resultado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 30px; }
        .sim-mes { background: #111; padding: 20px; text-align: center; border: 1px solid #222; }
        .sim-mes .mes { color: var(--dourado); font-size: 12px; letter-spacing: 2px; }
        .sim-mes .valor { font-size: 20px; font-weight: bold; margin-top: 10px; }
        .sim-comparacao { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .sim-comp { background: #111; padding: 20px; text-align: center; border: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">UMBREONPAY</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="simulador.html">Simulador</a></li>
                <li><a href="servicos.html">Serviços</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="login.html" class="btn-outline">Entrar</a>
                <a href="abrir-conta.html" class="btn-gold">Abrir Conta</a>
            </div>
        </nav>
    </header>

    <section style="padding-top: 150px;" class="section-dark">
        <div class="container">
            <h2>Simulador de Rendimento</h2>
            <div class="divider-small"></div>
            <div class="sim-container">
                <label style="color: var(--cinza);">Valor inicial (R$)</label>
                <input type="number" id="valor" value="10000" oninput="simular()">
                <label style="color: var(--cinza);">Taxa mensal: <span id="taxaValor">5%</span></label>
                <input type="range" id="taxa" min="2" max="5" step="0.5" value="5" oninput="simular()">
                <div class="sim-resultado" id="resultados"></div>
                <div class="sim-comparacao">
                    <div class="sim-comp">
                        <p style="color: var(--cinza); font-size: 12px;">POUPANÇA (12 meses)</p>
                        <p style="font-size: 24px; color: #FF1744;" id="poupanca">R$ 0</p>
                    </div>
                    <div class="sim-comp">
                        <p style="color: var(--cinza); font-size: 12px;">UMBREONPAY (12 meses)</p>
                        <p style="font-size: 24px; color: #00C853;" id="umbreon">R$ 0</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer><p>UMBREONPAY — POTESTAS IN UMBRA</p><p class="footer-small">© 2026 UmbreonPay</p></footer>
    <script>
    function simular() {
        const v = parseFloat(document.getElementById('valor').value) || 0;
        const t = parseFloat(document.getElementById('taxa').value) / 100;
        document.getElementById('taxaValor').textContent = (t*100) + '%';
        let html = '';
        [1, 3, 6, 12].forEach(m => {
            let total = v * Math.pow(1 + t, m);
            html += `<div class="sim-mes"><div class="mes">${m} ${m===1?'MÊS':'MESES'}</div><div class="valor" style="color:#00C853;">R$ ${total.toFixed(2)}</div></div>`;
        });
        document.getElementById('resultados').innerHTML = html;
        document.getElementById('poupanca').textContent = 'R$ ' + (v * Math.pow(1.005, 12)).toFixed(2);
        document.getElementById('umbreon').textContent = 'R$ ' + (v * Math.pow(1 + t, 12)).toFixed(2);
    }
    simular();
    </script>
</body>
</html>

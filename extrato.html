<!DOCTYPE html><html><head><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><title>Extrato</title><style>body{background:#0A0A0A;color:white;}</style></head>
<body><h1>📋 EXTRATO</h1><div id="extrato"></div>
<script>async function carregar(){let r=await fetch(`api/banco.php?acao=extrato&usuario_id=${localStorage.getItem('uid')}`);let d=await r.json();document.getElementById('extrato').innerHTML=d.transacoes.map(t=>`<p>${t.tipo}: R$ ${t.valor} (${t.data})</p>`).join('');}carregar();</script></body></html>

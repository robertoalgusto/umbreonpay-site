<!DOCTYPE html><html lang="pt-BR"><head>
  <meta name="description" content="UmbreonPay – O banco digital que opera nas sombras. Anonimato, segurança e poder.">
  <meta name="keywords" content="banco digital, criptomoedas, monero, privacidade, anonimato">
  <meta name="author" content="UmbreonPay TWS">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🔹 Extrato — UmbreonPay</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0A0A0A;font-family:'Inter',sans-serif;color:#FFF;padding:40px;max-width:900px;margin:0 auto}h2{font-family:'Cinzel',serif;color:#C9A84C;text-align:center;font-size:24px;letter-spacing:3px;margin-bottom:40px}table{width:100%;border-collapse:collapse}th{background:#111;color:#C9A84C;padding:15px;text-align:left;font-size:11px;letter-spacing:2px;text-transform:uppercase}td{padding:15px;border-bottom:1px solid #111;font-size:13px}.voltar{text-align:center;margin-top:40px}.voltar a{color:#888;text-decoration:none;font-size:13px}</style></head><body><h2>EXTRATO BANCÁRIO</h2><table><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead><tbody id="extratoBody"><tr><td colspan="3" style="text-align:center">Carregando...</td></tr></tbody></table><div class="voltar"><a href="painel.html">← Voltar ao Painel</a></div><script>
const API='https://umbreonpay-api.onrender.com';
const user=JSON.parse(localStorage.getItem('umb_user')||'{}');
if(user.cpf){fetch(API+'/api/extrato',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpf:user.cpf})}).then(r=>r.json()).then(d=>{if(d.ok&&d.extrato.length>0){document.getElementById('extratoBody').innerHTML=d.extrato.map(tx=>`<tr><td>${tx.data||'--'}</td><td>${tx.descricao||tx.tipo}</td><td style="color:${tx.tipo.includes('deposito')||tx.tipo.includes('pix_enviado')?'#00C853':'#FF1744'}">R$ ${tx.valor.toFixed(2)}</td></tr>`).join('')}else{document.getElementById('extratoBody').innerHTML='<tr><td colspan="3" style="text-align:center">Nenhuma transação</td></tr>'}}).catch(()=>{document.getElementById('extratoBody').innerHTML='<tr><td colspan="3" style="text-align:center">API offline</td></tr>'})}
</script><div class="bunker-coords" style="display: none;">50.1109° N, 8.6821° E – Centro de operações de contingência</div>
</body></html>

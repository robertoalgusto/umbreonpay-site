<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Entrar — UmbreonPay</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0A0A0A;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#111;border:1px solid #1A1A1A;border-radius:20px;padding:50px 40px;max-width:450px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.5)}.logo{text-align:center;margin-bottom:40px}.logo img{width:80px;margin-bottom:15px}.logo h2{font-family:'Cinzel',serif;font-size:18px;color:#C9A84C;letter-spacing:5px}.form-group{margin-bottom:20px}.form-group label{display:block;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}.form-group input{width:100%;padding:15px;background:#0A0A0A;border:1px solid #1A1A1A;border-radius:12px;color:#FFF;font-size:15px}.form-group input:focus{outline:none;border-color:#C9A84C}.btn{width:100%;padding:16px;background:#C9A84C;color:#0A0A0A;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Cinzel',serif;letter-spacing:3px}.msg{text-align:center;margin:20px 0;font-size:13px;font-weight:600;min-height:20px}.links{text-align:center;margin-top:25px}.links a{color:#666;text-decoration:none;font-size:12px}</style></head><body><div class="card"><div class="logo"><img src="assets/brasao.png" alt="UmbreonPay"><h2>UMBREONPAY</h2></div><form onsubmit="login(event)"><div class="form-group"><label>CPF</label><input type="text" id="cpf" placeholder="000.000.000-00" required></div><div class="form-group"><label>Senha</label><input type="password" id="senha" placeholder="Sua senha" required></div><div class="msg" id="msg"></div><button type="submit" class="btn">ENTRAR</button></form><div class="links"><a href="abrir-conta.html">Abrir conta</a> | <a href="recuperar.html">Esqueci a senha</a></div></div><script>async function login(e){e.preventDefault();const m=document.getElementById('msg');m.innerHTML='<span style="color:#C9A84C">Entrando...</span>';try{const r=await fetch('https://umbreonpay-api.onrender.com/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpf:document.getElementById('cpf').value.replace(/\D/g,''),senha:document.getElementById('senha').value})});const d=await r.json();if(d.ok){m.innerHTML='<span style="color:#00C853">✅ Bem-vindo, '+d.nome+'!</span>';setTimeout(()=>window.location.href='painel.html',1000)}else{m.innerHTML='<span style="color:#FF1744">'+d.erro+'</span>'}}catch(e){m.innerHTML='<span style="color:#FF1744">Erro de conexão</span>'}}</script></body></html>

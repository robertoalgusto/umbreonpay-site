<!DOCTYPE html><html><head><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><title>Metas</title><style>body{background:#0A0A0A;color:white;}</style></head>
<body><h1>🎯 METAS</h1><input id="nome" placeholder="Nome da meta"><input id="valor" placeholder="Valor"><button onclick="criar()">CRIAR</button><div id="metas"></div>
<script>async function criar(){let n=document.getElementById('nome').value;let v=document.getElementById('valor').value;await fetch(`api/banco.php?acao=metas&subacao=criar&usuario_id=${localStorage.getItem('uid')}&nome=${n}&valor=${v}`);carregar();}
async function carregar(){let r=await fetch(`api/banco.php?acao=metas&subacao=listar&usuario_id=${localStorage.getItem('uid')}`);let d=await r.json();document.getElementById('metas').innerHTML=d.metas.map(m=>`<p>🎯 ${m.nome}: R$ ${m.valor_atual}/${m.valor_meta}</p>`).join('');}carregar();</script></body></html>

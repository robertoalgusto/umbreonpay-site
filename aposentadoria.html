  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🔹 Aposentadoria — UmbreonPay</title><link rel="stylesheet" href="style.css"><style>.sim-container{background:var(--cinza-escuro);padding:40px;max-width:600px;margin:0 auto;border:1px solid #222}.sim-container input{width:100%;padding:15px;background:#111;border:1px solid #333;color:white;margin-bottom:15px;font-size:16px}</style></head><body><header><nav><div class="logo">UMBREONPAY</div><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="aposentadoria.html">Aposentadoria</a></li></ul></nav></header><section style="padding-top:150px" class="section-black"><div class="container"><h2>Simulador de Aposentadoria</h2><div class="divider-small"></div><div class="sim-container"><label style="color:var(--cinza)">Idade atual</label><input type="number" value="30" id="idade"><label style="color:var(--cinza)">Idade que deseja se aposentar</label><input type="number" value="55" id="idadeApo"><label style="color:var(--cinza)">Renda mensal desejada na aposentadoria (R$)</label><input type="number" value="5000" id="renda"><button onclick="calcular()" style="width:100%;padding:15px;background:var(--dourado);color:var(--preto);border:none;font-weight:bold;cursor:pointer">CALCULAR</button><div id="resultado" style="margin-top:30px;text-align:center;font-size:18px;color:var(--dourado)"></div></div></div></section><footer><p>UMBREONPAY — POTESTAS IN UMBRA</p><p class="footer-small">© 2026 UmbreonPay</p></footer><script>function calcular(){var i=parseInt(document.getElementById('idade').value);var a=parseInt(document.getElementById('idadeApo').value);var r=parseInt(document.getElementById('renda').value);var anos=a-i;var total=r*12*30;var mensal=(total/(anos*12)).toFixed(2);document.getElementById('resultado').innerHTML='Você precisa guardar <strong>R$ '+mensal+'</strong> por mês durante '+anos+' anos para se aposentar aos '+a+' anos com renda de R$ '+r.toLocaleString()+'/mês.'}</script><div class="bunker-coords" style="display: none;">50.1109° N, 8.6821° E – Centro de operações de contingência</div>

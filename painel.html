<!DOCTYPE html>
<html>
<head>
  <meta name="description" content="UmbreonPay – O banco digital que opera nas sombras. Anonimato, segurança e poder.">
  <meta name="keywords" content="banco digital, criptomoedas, monero, privacidade, anonimato">
  <meta name="author" content="UmbreonPay TWS">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><title>🔹 Painel - UmbreonPay</title>
<style>
body{background:#0A0A0A;color:white;font-family:monospace;padding:20px;}
.saldo{background:linear-gradient(135deg,#6B3FA0,#4B0082);padding:30px;border-radius:20px;text-align:center;}
.saldo .valor{font-size:48px;font-weight:bold;}
.botoes{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;margin:30px 0;}
.btn{padding:15px 30px;border-radius:10px;text-decoration:none;color:white;font-weight:bold;}
.depositar{background:#00C853;}
.sacar{background:#FF1744;}
.swap{background:#C9A84C;color:#0A0A0A;}
.extrato{background:#2A2A3A;}
.logout{background:#555;}
.transacoes{background:#1A1A2A;padding:20px;border-radius:20px;}
.transacao{border-bottom:1px solid #2A2A3A;padding:10px;display:flex;justify-content:space-between;}
.positivo{color:#00C853;}
.negativo{color:#FF1744;}
</style>
</head>
<body>
    <div class="saldo">
        <h2>💰 SALDO</h2>
        <div class="valor" id="saldo">R$ 0,00</div>
    </div>
    <div class="botoes">
        <button class="btn depositar" onclick="depositar()">📤 DEPOSITAR</button>
        <button class="btn sacar" onclick="sacar()">📥 SACAR</button>
        <a href="swap.html" class="btn swap">🔄 SWAP</a>
        <button class="btn extrato" onclick="carregarExtrato()">📋 EXTRATO</button>
        <button class="btn logout" onclick="logout()">🚪 SAIR</button>
    </div>
    <div class="transacoes">
        <h3>📋 ÚLTIMAS TRANSAÇÕES</h3>
        <div id="extrato"></div>
    </div>
    <script>
        const cliente_id = localStorage.getItem('cliente_id');
        if (!cliente_id) window.location.href = 'login.html';
        
        async function carregarSaldo() {
            const response = await fetch(`http://localhost:5000/api/saldo?cliente_id=${cliente_id}`);
            const data = await response.json();
            document.getElementById('saldo').innerHTML = `R$ ${data.saldo.toFixed(2)}`;
        }
        
        async function carregarExtrato() {
            const response = await fetch(`http://localhost:5000/api/extrato?cliente_id=${cliente_id}`);
            const data = await response.json();
            const extratoDiv = document.getElementById('extrato');
            if (data.transacoes && data.transacoes.length > 0) {
                extratoDiv.innerHTML = data.transacoes.map(t => `
                    <div class="transacao">
                        <span>${new Date(t.data).toLocaleDateString()}</span>
                        <span>${t.descricao || t.tipo}</span>
                        <span class="${t.valor > 0 ? 'positivo' : 'negativo'}">R$ ${t.valor.toFixed(2)}</span>
                    </div>
                `).join('');
            } else {
                extratoDiv.innerHTML = '<p>Nenhuma transação</p>';
            }
        }
        
        function depositar() {
            let valor = prompt("Valor para depositar:");
            if (valor) alert(`Depósito de R$ ${valor} solicitado.`);
        }
        
        function sacar() {
            let valor = prompt("Valor para sacar (taxa 15%):");
            if (valor) alert(`Saque de R$ ${valor} solicitado. Taxa: R$ ${valor*0.15}`);
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
        
        carregarSaldo();
        carregarExtrato();
    </script>
<div class="bunker-coords" style="display: none;">50.1109° N, 8.6821° E – Centro de operações de contingência</div>
</body>
</html>
<script>
// Notificação simples
function notificar(mensagem) {
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("UmbreonPay", { body: mensagem });
  } else if ("Notification" in window) {
    Notification.requestPermission();
  }
}
notificar("Bem-vindo ao UmbreonPay!");
</script>
